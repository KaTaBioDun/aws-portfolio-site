name: Deploy to S3 and CloudFront

on:
  push:
    branches: [main]

# Required so the job can request an OIDC token from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # TEMPORARY: prints the subject claim GitHub sends, so we can compare it to the trust policy
      - name: Print OIDC subject claim
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          echo "$PAYLOAD==" | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref}'

      - name: Assume AWS role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::428571188297:role/github-actions-portfolio-deploy
          aws-region: eu-west-2

      - name: Upload index.html to S3
        run: aws s3 cp index.html s3://biodun-portfolio-site-2026/index.html

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EDXIVSDJZG3UC --paths "/*"
